<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-grad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle geometric background lines -->
  <circle cx="1050" cy="150" r="320" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="1050" cy="150" r="480" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="150" cy="550" r="280" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.1" />

  <!-- Katatib Logo Left/Right balanced -->
  <g transform="translate(850, 195) scale(2.4)" filter="url(#shadow)" stroke="url(#gold-grad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 34 V 62 L 47 71" stroke-width="4.5" />
    <path d="M 80 34 V 62 L 53 71" stroke-width="4.5" />
    <path d="M 26 30 V 58 L 47 65" stroke-width="4.5" />
    <path d="M 74 30 V 58 L 53 65" stroke-width="4.5" />
    <path d="M 32 26 C 38 26 44 36 50 36 C 56 36 62 26 68 26" stroke-width="4.5" />
    <path d="M 32 26 V 54 L 47 59" stroke-width="4.5" />
    <path d="M 68 26 V 54 L 53 59" stroke-width="4.5" />
    <path d="M 30 78 V 70 L 38 78" stroke-width="4.5" />
    <path d="M 70 78 V 70 L 62 78" stroke-width="4.5" />
    <path d="M 30 78 C 38 74 50 68 50 56 V 48" stroke-width="4.5" />
    <path d="M 70 78 C 62 74 50 68 50 56" stroke-width="4.5" />
    <path d="M 43 55 L 50 48 L 57 55" stroke-width="4.5" />
  </g>

  <!-- Content text on the left/center -->
  <g transform="translate(100, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#047857" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" />
    <text x="140" y="26" text-anchor="middle" fill="#A7F3D0" font-family="'Cairo', sans-serif, system-ui" font-weight="700" font-size="16" letter-spacing="1">
      🌍 الدليل العالمي للكتاتيب القرآنية
    </text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#FFFFFF" font-family="'Cairo', 'Amiri', serif, system-ui" font-weight="800" font-size="64" letter-spacing="-1">
      كتاتيب &bull; Katatib
    </text>

    <!-- Tagline Arabic -->
    <text x="0" y="180" fill="#FCD34D" font-family="'Cairo', sans-serif, system-ui" font-weight="700" font-size="28">
      جسر المسافرين إلى بيوت الله والكتاتيب القرآنية
    </text>

    <!-- Subtitle Arabic/English -->
    <text x="0" y="235" fill="#D1FAE5" font-family="'Cairo', sans-serif, system-ui" font-weight="500" font-size="20">
      استكشف مراكز التحفيظ، شارك موقع جمعيتك، وحافظ على وردك القرآني أينما حللت
    </text>
    <text x="0" y="270" fill="#6EE7B7" font-family="'Inter', sans-serif, system-ui" font-weight="500" font-size="18">
      Explore traditional Quranic Kuttabs worldwide &bull; katatib.web.app
    </text>

    <!-- Call to action pill -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="220" height="52" rx="16" fill="url(#gold-grad)" />
      <text x="110" y="32" text-anchor="middle" fill="#022c22" font-family="'Cairo', sans-serif, system-ui" font-weight="800" font-size="18">
        استكشف الخريطة 🗺️
      </text>
    </g>
  </g>
</svg>
